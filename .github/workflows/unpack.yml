name: unpack-source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        if: hashFiles('v2-upload.zip') != ''
        run: |
          unzip -o v2-upload.zip -d /tmp/v2
          cp -a /tmp/v2/. .
          rm -f v2-upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack source archive"
          git push
