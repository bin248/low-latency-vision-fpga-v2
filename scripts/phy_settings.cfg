# Tang Dynasty 布局布线 run 的 settings 模板。
# 假设 TD 工程目录为 repo/td_project，run 目录为 repo/td_project/camera_to_dsi_display_Runs/phy_1。
# 如果目录层级不同，请把所有相对路径改成实际位置。

set ADCList {"../../../constraints/pin.adc"}
set IpADCList { ddr2 ../../../vendor_ip/ph1p35_ddr/ddr2/src/adc/ddr2.adc }
set IpSDCList { ddr2 ../../../vendor_ip/ph1p35_ddr/ddr2/src/sdc/ddr2.sdc w128_d512_fifo ../../../vendor_ip/w128_d512_fifo/w128_d512_fifo.tcl }
set SDCList {"../../../constraints/camera_to_dsi_display.sdc"}
set area_option -packarea
set arr_filter false
set device_name ph1_35p.db
set drHoldFix on
set end_step opt_route
set package_name PH1P35MDG324
set parent ../syn_1
set prj_name {camera_to_dsi_display}
set run_type phy
set speed 3
set start_step opt_place
set top_model_name {design_top_wrapper}

# improve8 的实测布局参数：打包更积极，同时降低 HFN 优化占用，给高密度布局留出空间。
set phyWildParams {gate pack_effort high place hfn_opt_effort low}
